name: Build, Test, and Coverage

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: benchmarks
      - uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.HeadlessAi
          ref: development
          path: benchmarks/dependencies/HeadlessAi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        working-directory: benchmarks
        run: dotnet restore TheSingularityWorkshop.HeadlessAi.Benchmarks.sln
      - name: Build
        working-directory: benchmarks
        run: dotnet build TheSingularityWorkshop.HeadlessAi.Benchmarks.sln --configuration Release --no-restore
      - name: Test with coverage
        working-directory: benchmarks
        run: dotnet test TheSingularityWorkshop.HeadlessAi.Benchmarks.sln --configuration Release --no-build --collect:"XPlat Code Coverage;Format=cobertura" --results-directory ./TestResults
      - name: Prepare coverage report
        shell: bash
        working-directory: benchmarks
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.HeadlessAi.Benchmarks
          files: benchmarks/TestResults/coverage.cobertura.xml
          fail_ci_if_error: false
