<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">HeadlessAi benchmark scope</title><desc id="desc">A fixed benchmark input flows through HeadlessAi into a fake in-memory HTTP handler and a fixed JSON response. The measurement excludes network and model inference.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect x="20" y="72" width="230" height="130" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="135" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Fixed input</text><text x="135" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1e3a8a">Preallocated prompt</text><text x="135" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1e3a8a">Known workload</text>
<rect x="320" y="72" width="240" height="130" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="440" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#4c1d95">HeadlessAi</text><text x="440" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#4c1d95">Request + response</text><text x="440" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#4c1d95">Local overhead</text>
<rect x="630" y="72" width="240" height="130" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="750" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#134e4a">Fake handler</text><text x="750" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#134e4a">In-memory response</text><text x="750" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#134e4a">No network</text>
<rect x="940" y="72" width="240" height="130" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1060" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#78350f">Measured</text><text x="1060" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#78350f">Time + allocations</text><text x="1060" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#78350f">BenchmarkDotNet</text>
<path d="M250 137 H310 M560 137 H620 M870 137 H930" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#475569">Out of scope: internet latency • provider queues • model inference • token generation</text><text x="600" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#64748b">No live provider calls • No performance numbers until a real run is recorded</text>
</svg>